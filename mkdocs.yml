# AI Model Vault — MkDocs Configuration
# Build: mkdocs build          (outputs to website/public/mkdocs/)
# Serve: mkdocs serve           (dev preview at http://127.0.0.1:8000)
# Deploy to Next.js: mkdocs build && next build  (from website/)

site_name: AI Model Vault
site_description: Universal cross-platform secure vault for AI model storage, versioning, and management
site_author: NERVOSYS AI Team
site_url: https://aimodelvault.nervosys.ai/mkdocs/
repo_url: https://github.com/nervosys/AIModelVault
repo_name: nervosys/AIModelVault
copyright: "&copy; 2025-2026 NERVOSYS. Licensed under AGPL-3.0-or-later."

docs_dir: docs
site_dir: website/public/mkdocs

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

  # PyMdown Extensions
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nervosys/AIModelVault
  generator: false

