# Default values for ai-model-vault Helm chart

replicaCount: 1

image:
  repository: ghcr.io/nervosys/ai-model-vault
  tag: "3.0.0"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

api:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  jwtSecret: ""               # Set via secret; auto-generated if empty
  tokenExpiry: 3600
  corsPermissive: false
  noDashboard: false
  # File the JWT revocation list persists to. Must be on a volume that
  # outlives the pod, or revoked tokens are re-admitted on every restart.
  revocationStore: "/data/revocations.json"

# Telemetry, and its OTLP export.
#
# Scoped to this Deployment's containers -- it never touches the node
# environment, so two releases in the same cluster can report to different
# collectors and nothing else on the host inherits these settings.
telemetry:
  # Telemetry is opt-in and off by default. Setting an OTLP endpoint below
  # does NOT turn it on; this must be true as well. Turning it on means this
  # deployment reports usage to the collector you configure.
  enabled: false

  otlp:
    # Standard OpenTelemetry variables. Leave endpoint empty to disable export.
    endpoint: ""             # e.g. https://collector.example.com/otlp
    protocol: "http/protobuf" # or http/json
    serviceName: "ai-model-vault"

    # The Authorization header is a credential and is NEVER set here --
    # values.yaml is committed, templated into a ConfigMap-shaped object, and
    # printed by `helm get values`.
    #
    # Create the Secret out of band and name it:
    #
    #   kubectl create secret generic aim-otlp \
    #     --from-literal=headers='Authorization=Bearer <token>'
    #
    # then set existingSecret to its name. The value is injected as
    # OTEL_EXPORTER_OTLP_HEADERS at container start.
    headersSecret:
      existingSecret: ""     # e.g. aim-otlp
      key: headers

persistence:
  data:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  config:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  cache:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 5Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: aim.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: aim-tls
  #    hosts:
  #      - aim.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

startupProbe:
  httpGet:
    path: /api/v1/health
    port: http
  failureThreshold: 30
  periodSeconds: 2

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
