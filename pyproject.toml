[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuralvault"
version = "0.1.0"
description = "Universal cross-platform XDG-compliant secure vault for AI model formats"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "NervoSys AI Team"}
]
keywords = ["ai", "ml", "vault", "security", "model-conversion", "encryption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "cryptography>=42.0.0",  # FIPS 140-3 compliant crypto
    "pyyaml>=6.0",
    "click>=8.0",
    "tqdm>=4.65.0",
    "platformdirs>=4.0.0",  # XDG compliance
    "filelock>=3.12.0",
    "jsonschema>=4.19.0",
    "packaging>=23.0",
]

[project.optional-dependencies]
ml = [
    # Model format support (multi-GB, install only when needed)
    "torch>=2.0.0",
    "tensorflow>=2.13.0",
    "onnx>=1.14.0",
    "safetensors>=0.4.0",
    "numpy>=1.24.0",
    "h5py>=3.9.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.286",
    "mypy>=1.5.0",
    "pre-commit>=3.3.0",
]
security = [
    "safety>=2.3.0",  # CVE scanning
    "bandit>=1.7.5",  # Security linting
    "pip-audit>=2.6.0",  # Dependency vulnerability scanning
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]

[project.scripts]
neuralvault = "neuralvault.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=neuralvault --cov-report=html --cov-report=term"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "N", "W", "B", "S"]  # S for security checks

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
