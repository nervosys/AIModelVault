# Deny certain crates
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Transitive deps from azure-sdk, sled, hdf5, qdrant-client, aws-sdk — not under our control.
# Every entry must name the crate, the path that pulls it in, and what would clear it.
ignore = [
    "RUSTSEC-2025-0057", # fxhash unmaintained (via sled)
    "RUSTSEC-2024-0384", # instant unmaintained (via sled, hdf5, azure)
    "RUSTSEC-2024-0436", # paste unmaintained (via hdf5, azure)
    "RUSTSEC-2025-0134", # rustls-pemfile unmaintained (via azure, qdrant/tonic)
    "RUSTSEC-2026-0002", # lru unsound IterMut (via aws-sdk-s3)
    "RUSTSEC-2026-0097", # rand 0.7.3 unsound w/ custom logger (via transitive deps)
    "RUSTSEC-2026-0174", # http-types ASCII invariant notice (via azure_core 0.21)

    # quick-xml 0.31 is pinned by azure_core 0.21 — the last release of the legacy
    # Azure SDK line, which has no path to quick-xml 0.41. Both advisories are
    # denial-of-service via a malicious XML *response*, so they require a hostile
    # or compromised storage endpoint; they are not reachable from vault data.
    # Clearing them requires migrating `src/storage/azure.rs` to the rewritten
    # Azure SDK (`azure_storage_blob`, 1.1.0-beta.1 at the time of writing) and
    # its TokenCredential auth model. Revisit when that crate leaves beta.
    "RUSTSEC-2026-0194", # quick-xml quadratic duplicate-attribute scan (via azure_core)
    "RUSTSEC-2026-0195", # quick-xml unbounded namespace allocation (via azure_core)
]

# Resolved, kept here so they are not re-added by reflex:
#   RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101) — fixed by disabling the AWS
#   SDKs' legacy `rustls` feature in Cargo.toml; the modern client uses webpki 0.103.
#   RUSTSEC-2026-0176/0177 (pyo3 0.24) — fixed by upgrading to pyo3 0.29.
#   RUSTSEC-2026-0185 (quinn-proto), RUSTSEC-2026-0204 (crossbeam-epoch) — fixed by
#   `cargo update`.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
