name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: aim
            asset_name: aim-linux-amd64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: aim
            asset_name: aim-linux-musl-amd64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: aim.exe
            asset_name: aim-windows-amd64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: aim
            asset_name: aim-darwin-amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: aim
            asset_name: aim-darwin-arm64

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install musl tools (Linux musl)
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: sudo apt-get install -y musl-tools

    - name: Run tests
      if: matrix.target != 'aarch64-apple-darwin'
      run: cargo test --release --target ${{ matrix.target }}

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Strip binary (Unix)
      if: runner.os != 'Windows'
      run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

    - name: Rename binary
      shell: bash
      run: |
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

    - name: Generate SHA-256 checksum
      shell: bash
      run: |
        sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ${{ matrix.asset_name }}
          ${{ matrix.asset_name }}.sha256
