# Deny certain crates
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Transitive deps from azure-sdk, sled, hdf5, qdrant-client, aws-sdk — not under our control:
ignore = [
    "RUSTSEC-2025-0057",  # fxhash unmaintained (via sled)
    "RUSTSEC-2024-0384",  # instant unmaintained (via sled, hdf5, azure)
    "RUSTSEC-2024-0436",  # paste unmaintained (via hdf5, azure)
    "RUSTSEC-2025-0134",  # rustls-pemfile unmaintained (via azure, qdrant/tonic)
    "RUSTSEC-2026-0002",  # lru unsound IterMut (via aws-sdk-s3)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
