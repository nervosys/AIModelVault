# Deny certain crates
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# No suppressions. Every advisory this project once ignored is now genuinely
# fixed, so the list is empty — add an entry only with the crate, the path that
# pulls it in, and what would clear it.
ignore = []

# Previously ignored, now actually resolved — recorded so they are not re-added
# by reflex if an old config resurfaces:
#   RUSTSEC-2026-0098/0099/0104 (rustls-webpki 0.101) — fixed by disabling the AWS
#     SDKs' legacy `rustls` feature; the modern client uses webpki 0.103.
#   RUSTSEC-2026-0176/0177 (pyo3 0.24) — fixed by upgrading to pyo3 0.29.
#   RUSTSEC-2026-0185 (quinn-proto), RUSTSEC-2026-0204 (crossbeam-epoch),
#     RUSTSEC-2026-0002 (lru) — fixed by `cargo update`.
#   RUSTSEC-2026-0194/0195 (quick-xml 0.31), RUSTSEC-2026-0174 (http-types) —
#     fixed by migrating Azure to the SDK v1 stack, which uses quick-xml 0.41.
#   fxhash / instant / paste / rustls-pemfile unmaintained advisories no longer
#     match the dependency graph.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
