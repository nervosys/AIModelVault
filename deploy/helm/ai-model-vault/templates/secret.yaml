apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-model-vault.fullname" . }}
  labels:
    {{- include "ai-model-vault.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.api.jwtSecret }}
  jwt-secret: {{ .Values.api.jwtSecret | b64enc | quote }}
  {{- else }}
  {{- /*
    Reuse the secret already in the cluster when there is one.

    `randAlphaNum` is evaluated on every render, so a bare `helm upgrade`
    minted a *new* JWT signing key and silently invalidated every token the
    running deployment had issued — clients saw blanket 401s until they
    re-authenticated, and any in-flight agent run died mid-task. Nothing in
    the chart signalled that upgrading was a credential rotation.

    `lookup` returns the live Secret (empty on a first install), so the
    generated key is created once and then carried forward. Its `data` values
    are already base64, hence no second `b64enc`.

    Caveat: `lookup` returns nothing under `helm template` and
    `--dry-run` (no API server to query), so rendered manifests show a fresh
    random value. That is a rendering artefact — the applied upgrade path
    preserves the key. Set `api.jwtSecret` explicitly, or point the
    deployment at an externally managed Secret, if you need the value to be
    reproducible outside the cluster.
  */}}
  {{- $name := include "ai-model-vault.fullname" . }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
  {{- $current := "" }}
  {{- if $existing }}
  {{- $current = index (default dict $existing.data) "jwt-secret" | default "" }}
  {{- end }}
  {{- if $current }}
  jwt-secret: {{ $current | quote }}
  {{- else }}
  jwt-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
