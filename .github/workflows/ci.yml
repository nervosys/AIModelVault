name: CI
# Security note (S-02): The aimodelvault_PASSPHRASE environment variable is
# used only during integration tests. Configure it as a masked GitHub Actions
# secret (Settings -> Secrets -> Actions) -- never hardcode it in workflow files.
# All secret values are automatically masked in logs by GitHub Actions, but
# ensure your test scripts do not echo or print passphrases to stdout/stderr.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build
      run: cargo build --features "full,graphql" --verbose

    - name: Run tests
      run: cargo test --features "full,graphql" --verbose

    - name: Run clippy
      run: cargo clippy --features "full,graphql" -- -D warnings

    - name: Check formatting
      run: cargo fmt -- --check

  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust 1.75
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.75"

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}

    - name: Check (MSRV)
      run: cargo check --features "full,graphql"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build docs
      run: cargo doc --lib --no-deps --features "full,graphql"
      env:
        RUSTDOCFLAGS: "-D warnings"

  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Python deps
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Python tests
      run: python -m pytest tests/test_aimodelvault.py -v

  fuzz:
    name: Fuzz Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust nightly
      uses: dtolnay/rust-toolchain@nightly

    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz --locked

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          fuzz/target
        key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock') }}

    - name: Fuzz crypto_roundtrip
      run: cargo +nightly fuzz run crypto_roundtrip -- -max_total_time=30

    - name: Fuzz format_detection
      run: cargo +nightly fuzz run format_detection -- -max_total_time=30

    - name: Fuzz model_metadata
      run: cargo +nightly fuzz run model_metadata -- -max_total_time=30

    - name: Fuzz version_parsing
      run: cargo +nightly fuzz run fuzz_version_parsing -- -max_total_time=30

    - name: Fuzz conversion_pipeline
      run: cargo +nightly fuzz run fuzz_conversion_pipeline -- -max_total_time=30

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit --locked

    - name: Run audit
      run: cargo audit

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.lock') }}

    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov --locked

    - name: Generate coverage
      run: cargo llvm-cov --features "full,graphql" --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./lcov.info
        fail_ci_if_error: false

  integration:
    name: CLI Integration Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-integration-${{ hashFiles('**/Cargo.lock') }}

    - name: Build binary
      run: cargo build --features "full,graphql"

    - name: Run CLI integration tests
      run: cargo test --test cli_tests --features "full,graphql" -- --test-threads=1

  deny:
    name: Dependency Checks
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-deny
      run: cargo install cargo-deny --locked

    - name: Check licenses & advisories
      run: cargo deny check