[package]
name = "ai-model-vault"
version = "1.3.0"
edition = "2021"
rust-version = "1.75"
authors = ["NERVOSYS AI Team"]
description = "Universal cross-platform XDG-compliant secure vault for AI model formats (Neural and Neurosymbolic)"
license = "AGPL-3.0-or-later"
repository = "https://github.com/nervosys/AIModelVault"
homepage = "https://github.com/nervosys/AIModelVault"
documentation = "https://docs.rs/ai-model-vault"
readme = "README.md"
keywords = ["ai", "ml", "vault", "security", "encryption"]
categories = ["cryptography", "science"]

[dependencies]
# Cryptography - FIPS 140-3 compliant
aes-gcm = "0.10"                                     # AES-GCM encryption
sha2 = "0.10"                                        # SHA-256 hashing
argon2 = "0.5"                                       # Alternative KDF (more secure than PBKDF2)
zeroize = { version = "1.7", features = ["derive"] } # Secure memory zeroing

# Compression
flate2 = "1.0"  # Gzip/zlib compression
lzma-rs = "0.3" # LZMA compression

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
toml = "0.8"

# File I/O and paths
tokio = { version = "1.35", features = ["full"] } # Async runtime
async-trait = "0.1"                               # Async trait support
bytes = "1.5"
tar = "0.4"                                       # TAR archive support
zip = "4"                                         # ZIP archive support

# Cloud storage backends (optional)
# Note: cloud-storage has unmaintained dependencies (ring 0.16, dotenv, instant)
# Consider using direct AWS/Azure SDKs for production
aws-config = { version = "1.1", optional = true }
aws-sdk-s3 = { version = "1.12", optional = true }
azure_storage = { version = "0.19", optional = true }
azure_storage_blobs = { version = "0.19", optional = true }
# cloud-storage = { version = "0.11", optional = true }  # Disabled due to security issues

# XDG compliance
directories = "5.0" # XDG base directories

# Concurrency
parking_lot = "0.12" # Fast mutex for telemetry

# System info
hostname = "0.4"

# Async streams (for GraphQL subscriptions)
async-stream = "0.3"

# HTTP client for telemetry
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
] }

# Error handling
thiserror = "1.0"

# Logging and auditing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
rpassword = "7.3"
hex = "0.4"
tempfile = "3.8"
# Model format support (optional features)
# These will be optional to reduce binary size
safetensors = { version = "0.4", optional = true }
ndarray = { version = "0.15", optional = true }
hdf5 = { version = "0.8", optional = true }

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# REST API (optional)
axum = { version = "0.7", features = ["json", "multipart"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = [
    "cors",
    "trace",
    "limit",
    "timeout",
], optional = true }
jsonwebtoken = { version = "9.3", optional = true }
utoipa = { version = "5", features = ["axum_extras"], optional = true }
base64 = { version = "0.22", optional = true }
hyper = { version = "1.4", optional = true }

# GraphQL API (optional)
async-graphql = { version = "7.0", features = [
    "chrono",
    "uuid",
], optional = true }
async-graphql-axum = { version = "7.0", optional = true }

# GPU acceleration (optional)
ocl = { version = "0.19", optional = true }

# Python bindings (optional)
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }

# Database support for RAG
rusqlite = { version = "0.31", features = [
    "bundled",
    "serde_json",
], optional = true }
sled = { version = "0.34", optional = true }
# Vector database support (optional)
qdrant-client = { version = "1.13", optional = true }
# lancedb removed: v0.4 depends on arrow-arith v51 which is incompatible with Rust 1.93+

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
assert_cmd = "2.1.2"
predicates = "3.1.4"

[features]
default = ["safetensors", "ndarray", "sqlite"]
full = [
    "safetensors",
    "ndarray",
    "sqlite",
    "sled",
    "vector-db",
] # Removed hdf5 - requires system library
hdf5-support = ["hdf5"] # Separate feature for users with HDF5 installed
# Database features
sqlite = ["rusqlite"]
kv-store = ["sled"]
vector-db = ["qdrant-client"]
database = ["sqlite", "kv-store"]
# Cloud storage features
s3 = ["aws-config", "aws-sdk-s3"]
azure = ["azure_storage", "azure_storage_blobs"]
# gcs = ["cloud-storage"]  # Disabled due to security vulnerabilities in cloud-storage crate
cloud = ["s3", "azure"] # GCS removed until cloud-storage is updated
# REST API
api = [
    "axum",
    "tower",
    "tower-http",
    "jsonwebtoken",
    "utoipa",
    "base64",
    "hyper",
]
# GraphQL API (requires api)
graphql = ["api", "async-graphql"]
# GPU-accelerated encryption
gpu = ["ocl"]
# Python native bindings
python = ["dep:pyo3"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Pedantic lints allowed project-wide (noisy / stylistic / not actionable)
assigning_clones = "allow"
case_sensitive_file_extension_comparisons = "allow"
cast_lossless = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
checked_conversions = "allow"
doc_markdown = "allow"
format_push_string = "allow"
if_not_else = "allow"
implicit_clone = "allow"
inefficient_to_string = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
map_unwrap_or = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
needless_pass_by_value = "allow"
needless_raw_string_hashes = "allow"
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
uninlined_format_args = "allow"
unnecessary_debug_formatting = "allow"
unnecessary_literal_bound = "allow"
unnecessary_wraps = "allow"
unreadable_literal = "allow"
unused_async = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
wildcard_imports = "allow"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0

[[bin]]
name = "aim"
path = "src/main.rs"

[lib]
name = "ai_model_vault"
path = "src/lib.rs"

[[bench]]
name = "crypto_bench"
harness = false

[[bench]]
name = "vault_bench"
harness = false

[[bench]]
name = "api_bench"
harness = false
required-features = ["api"]
